[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-os-langgraph"
version = "2.4.0"
description = "Deterministic multi-agent orchestration built with LangGraph."
readme = "README.md"
authors = [{ name = "Simon Tran" }]
license = "MIT"
keywords = [
    "agents",
    "coding-agent",
    "human-in-the-loop",
    "langgraph",
    "mcp",
    "multi-agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
dependencies = [
    "langgraph==1.2.10",
    "langgraph-checkpoint-sqlite==3.1.1",
    "langchain==1.3.14",
    "langchain-core==1.5.3",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "typing-extensions==4.16.0",
    "langchain-litellm==0.7.0",
    "litellm==1.95.0",
    "mcp==1.29.0",
    "langchain-mcp-adapters==0.3.1",
    "rich==15.0.0",
    "croniter==6.0.0",
]

[project.scripts]
agent-os = "agent_os.__main__:main"

[project.urls]
Homepage = "https://github.com/simon-aibc/agent-os-langgraph"
Documentation = "https://github.com/simon-aibc/agent-os-langgraph#readme"
Repository = "https://github.com/simon-aibc/agent-os-langgraph.git"
Changelog = "https://github.com/simon-aibc/agent-os-langgraph/blob/main/CHANGELOG.md"
Issues = "https://github.com/simon-aibc/agent-os-langgraph/issues"

[tool.setuptools.packages.find]
include = ["agent_os*"]

[tool.setuptools.package-data]
agent_os = ["py.typed"]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.4",
    "httpx",
]
serve = [
    "fastapi",
    # Starlette's TestClient imports `httpx2` (warns without it at 1.3, hard-imports
    # it at >=1.4); it's a real package, so depend on it explicitly rather than pin
    # starlette below mcp's >=0.48 floor. Keeps `pytest -W error` green on a fresh install.
    "httpx2",
    "uvicorn",
    "websockets"
]

[tool.pytest.ini_options]
pythonpath = ["."]
# -p no:threadexception: the async sqlite saver used by the websocket endpoint
# can raise a benign "Event loop is closed" in its background thread during
# TestClient teardown, which the threadexception plugin would non-deterministically
# attribute to an unrelated test and fail under `-W error`. Assertions are unaffected.
addopts = "-m 'not integration' -p no:threadexception"
filterwarnings = [
    "error",
]
markers = [
    "integration: requires explicitly enabled external services or CLI tools",
    "network: allows real outbound network connections in offline test suite",
]

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = [
    ".git",
    ".ruff_cache",
    ".pytest_cache",
    ".venv",
    "venv",
    "build",
    "dist",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
